[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gc-extension"
version = "0.1.0"
description = "Granger causality with Causal Bayesian networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "scikit-learn>=1.3",
    "numba>=0.57",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "mat73>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pylint>=3.0",
    "ruff>=0.3",
]
cdt = ["cdt"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pylint.messages_control]
disable = [
    "too-many-instance-attributes",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
]

[tool.pylint.format]
max-line-length = 99
